# Test-only overrides, layered over src/main/resources/application.yml
# (classpath:/config/ wins over classpath:/). No listener containers start in
# tests, so no test context talks to a broker unless it asks to
# (InventoryConsumerKafkaTest turns them back on against @EmbeddedKafka).
kafka:
  consumers-enabled: false

# No Eureka client in tests: no suite needs a running Eureka server, and no
# test context registers anything.
eureka:
  client:
    enabled: false

# No config server in tests: nothing may call localhost:8888, so every test runs on
# the local file values (decisions.md, Day 9).
spring:
  cloud:
    config:
      enabled: false

# No scheduled reconciler passes in tests: they would ask a real Order on
# localhost:8083 about other tests' rows. The reconciler tests call runOnce().
reconciler:
  enabled: false

# No warm-up in tests: it would run the reserve path at every context start. The
# warm-up tests turn it back on with their own properties.
startup-warmup:
  enabled: false

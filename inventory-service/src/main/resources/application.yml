server:
  # 8080 is reserved for the API Gateway. Each service gets a fixed port so
  # all four can run at once: identity 8081, inventory 8082, order 8083,
  # notification 8084.
  port: 8082

spring:
  application:
    name: inventory-service
  config:
    # Config server (decisions.md, Day 9). `optional:` = if it is down this service
    # still starts, on the values in THIS file (the local fallback). When it is up,
    # its values win over this file; env vars and system properties still win over
    # both (see decisions.md for the checked precedence).
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      # Timeouts for the config import, in ms. Library defaults (5.0.4, from its
      # bytecode): connect 10000, read 185000. A server that accepts and never answers
      # is tried 3 times per start (seen in the smoke run), so the wait is 3 x read.
      # Healthy local server: about 1 s per request, 2.5 s the slowest seen (each
      # request does a git fetch), so read 3000 keeps a healthy one and makes a hung
      # one cost about 9 s. Local only: they must work when the server is down.
      request-connect-timeout: 1000
      request-read-timeout: 3000

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory-service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (see db/migration/) owns the schema. Hibernate only validates
      # that @Entity mappings match what Flyway has already created — it
      # never generates or mutates DDL. See docs/decisions.md.
      ddl-auto: validate
    show-sql: true

  jackson:
    deserialization:
      # Jackson 3 accepts a JSON float where an int is expected and TRUNCATES
      # it by default, so {"quantity": 2.5} would reserve 2 units and return
      # 200. Turned off so a fractional count is a 400, not a silent change.
      accept-float-as-int: false

# Kafka consumers (decisions.md, "Day 7", points 3 and 4). Locally the
# docker-compose broker. Order creates the two topics; Inventory never does.
kafka:
  bootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
  # false: no listener containers start (tests that do not use Kafka).
  consumers-enabled: true
  consumer:
    group-id: inventory-service
    # Retry of a transient failure (DB down) is forever, with growing waits.
    # All three numbers PROVISIONAL, unmeasured, recheck Day 9. The cap stays
    # far below max.poll.interval.ms (5 min default) so a long wait is not
    # mistaken for a dead consumer.
    backoff-initial-ms: 1000
    backoff-multiplier: 2.0
    backoff-max-ms: 30000

# Registration with the Eureka server (decisions.md, "Day 8", addendum
# "Gateway and discovery"). Only the API Gateway looks services up; this
# service only registers. DEFAULT timings on purpose (heartbeat 30 s, lease
# 90 s): none are set here. If Eureka is down this service still starts and
# keeps retrying registration in the background (it logs, it does not fail).
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # One entry per process, so two instances on different ports register
    # separately instead of overwriting each other.
    instance-id: ${spring.application.name}:${server.port}
    # Register 127.0.0.1, not the machine's host name. Found in the Day 8
    # smoke run: Windows registered "<host>.mshome.net" (the Hyper-V/ICS
    # adapter), which the Gateway's Netty DNS resolver cannot resolve, so every
    # lb:// call was a 500 (UnknownHostException). Everything runs on one
    # laptop; a multi-host set-up would need the real address here instead.
    prefer-ip-address: true
    ip-address: 127.0.0.1

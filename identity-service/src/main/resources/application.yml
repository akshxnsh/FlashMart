server:
  # 8080 is reserved for the API Gateway. Each service gets a fixed port so
  # all four can run at once: identity 8081, inventory 8082, order 8083,
  # notification 8084.
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/identity-service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (see db/migration/) owns the schema. Hibernate only validates
      # that @Entity mappings match what Flyway has already created — it
      # never generates or mutates DDL. See docs/decisions.md.
      ddl-auto: validate
    show-sql: true

identity:
  password:
    # bcrypt work factor (decisions.md, "Day 8", point 6). Each +1 doubles the
    # time per hash. Provisional: the milliseconds per hash on this laptop are
    # not measured.
    bcrypt-strength: 10
  jwt:
    # HS256 key, from JWT_SECRET (decisions.md, "Day 8", point 1). No default:
    # a blank or shorter-than-32-byte value stops start-up (JwtIssuer).
    secret: ${JWT_SECRET:}
    # Access token lifetime (point 2). Provisional.
    access-ttl: 15m

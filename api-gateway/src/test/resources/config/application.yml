# Test-only overrides (classpath:/config/ wins over classpath:/). NOT real
# secrets. The JWT one is 64 bytes on purpose: long enough that an HS512 token
# signed with it would verify if the Gateway accepted HS512, so the "HS256
# only" test means something.
gateway-auth:
  jwt-secret: test-only-jwt-secret-0123456789-0123456789-0123456789-abcdefghij
  signing-secret: test-only-gateway-signing-secret-0123456789

# No Eureka client in tests: lb:// routes resolve through Spring Cloud's
# SimpleDiscoveryClient instead (spring.cloud.discovery.client.simple.*, set
# per test class), so no test needs a running Eureka server.
eureka:
  client:
    enabled: false

# The contract tests make many auth and order calls from one IP and a few
# buyers; their limits are far above anything they send, so they test routing
# and identity, not the limiter. RateLimitTest sets its own low values. Redis
# is the compose one on localhost:6379; the limiter fails open, so these tests
# pass without it.
gateway-ratelimit:
  orders:
    replenish-rate: 1000
    burst: 1000
  auth:
    replenish-rate: 1000
    burst: 1000

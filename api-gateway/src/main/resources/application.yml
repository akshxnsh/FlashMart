server:
  # Reserved for the Gateway since the scaffolding (architecture.md §8, Ports).
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    # Config server (decisions.md, Day 9). `optional:` = if it is down this service
    # still starts, on the values in THIS file (the local fallback). When it is up,
    # its values win over this file; env vars and system properties still win over
    # both (see decisions.md for the checked precedence).
    import: optional:configserver:http://localhost:8888

  # Redis for the rate limiter (see gateway-ratelimit below). The limiter FAILS
  # OPEN. The short timeouts keep a hung (not just stopped) Redis from stalling
  # requests for Lettuce's 60 s default; 500 ms is PROVISIONAL and unmeasured.
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms
  cloud:
    config:
      # Timeouts for the config import, in ms. Library defaults (5.0.4, from its
      # bytecode): connect 10000, read 185000. A server that accepts and never answers
      # is tried 3 times per start (seen in the smoke run), so the wait is 3 x read.
      # Healthy local server: about 1 s per request, 2.5 s the slowest seen (each
      # request does a git fetch), so read 3000 keeps a healthy one and makes a hung
      # one cost about 9 s. Local only: they must work when the server is down.
      request-connect-timeout: 1000
      request-read-timeout: 3000
    gateway:
      server:
        webflux:
          # NO default filters and NO Retry filter anywhere: a POST the Gateway
          # repeats is a request the buyer never sent. Retry safety is the
          # client resending with the same Idempotency-Key (decisions.md,
          # "Day 8", addendum "Gateway and discovery", point 6).
          routes:
            # Found through Eureka (decisions.md, "Day 8", addendum "Gateway and
            # discovery", point 2). The fixed addresses are the fallback profile
            # "fixed" (application-fixed.yml). There is NO route for /internal/**:
            # Order -> Inventory reserve is never routable.
            - id: identity
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${gateway-ratelimit.auth.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway-ratelimit.auth.burst}
            # POST /api/orders only is rate limited, per authenticated buyer
            # (decisions.md, "Day 8", point 7). Listed BEFORE the general order
            # route so it wins for POST; GETs and the webhook are not limited.
            # The limiter runs after AuthFilter (a global filter ordered first),
            # which sets X-Buyer-Id: that is what the key is read from.
            - id: order-create
              uri: lb://order-service
              predicates:
                - Path=/api/orders,/api/orders/**
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@buyerKeyResolver}"
                    redis-rate-limiter.replenishRate: ${gateway-ratelimit.orders.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway-ratelimit.orders.burst}
            - id: order
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**,/webhooks/payment
            - id: inventory
              uri: lb://inventory-service
              predicates:
                - Path=/api/flash-sales/**,/api/products/**

# Rate limits: PROVISIONAL, unmeasured, recheck on Day 9 (decisions.md, "Day 8",
# point 7). Token bucket: replenish-rate tokens/s, burst = bucket size. They
# protect the Gateway's and Order's capacity; they do NOT prevent overselling
# (Inventory's conditional UPDATE does).
gateway-ratelimit:
  orders:      # POST /api/orders, key = authenticated buyer id
    replenish-rate: 5
    burst: 10
  auth:        # /api/auth/**, key = client IP (socket address, never X-Forwarded-For)
    replenish-rate: 1
    burst: 5

eureka:
  client:
    # The Gateway looks services up but is never a target itself.
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
    # DEFAULT timings on purpose (registry fetch every 30 s; LoadBalancer cache
    # 35 s): none are set here. A stopped instance can stay in use until both
    # have refreshed; a hard-killed one until Eureka also evicts it.

# Named gateway-auth, not gateway: Spring's relaxed binding would map the
# environment variable GATEWAY_SIGNING_SECRET straight onto a property called
# gateway.signing-secret, silently outranking any config file (tests included).
gateway-auth:
  # The same HS256 secret Identity signs with (decisions.md, "Day 8", point 1).
  # From the environment only; blank or shorter than 32 bytes stops start-up.
  jwt-secret: ${JWT_SECRET:}
  # Signs the buyer id forwarded to Order (point 5). A DIFFERENT secret from the
  # JWT one; held by the Gateway and Order only. Same start-up rule.
  signing-secret: ${GATEWAY_SIGNING_SECRET:}

# Prometheus for the laptop set-up (decisions.md, Day 9, Part B). The services
# run on the HOST, Prometheus in a container, so targets are reached through
# host.docker.internal (Docker Desktop). Each service exposes its metrics on its
# own port at /actuator/prometheus; none is routed through the Gateway.
global:
  # 5 s so a short run (a demo, a load test of a few minutes) shows enough points.
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]

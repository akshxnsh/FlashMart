server:
  # 8080 is reserved for the API Gateway. Each service gets a fixed port so
  # all four can run at once: identity 8081, inventory 8082, order 8083,
  # notification 8084.
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order-service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (see db/migration/) owns the schema. Hibernate only validates
      # that @Entity mappings match what Flyway has already created — it
      # never generates or mutates DDL. See docs/decisions.md.
      ddl-auto: validate
    show-sql: true

  jackson:
    deserialization:
      # Jackson 3 accepts a JSON float where an int is expected and TRUNCATES
      # it by default, so {"quantity": 2.5} would order 2 units. Off, so a
      # fractional count is a 400. Same setting as Inventory.
      accept-float-as-int: false

  cloud:
    openfeign:
      client:
        config:
          inventory:
            # Explicit, never Feign's defaults (10 s connect / 60 s read).
            # Both come from inventory.* below, so the values the CREATED
            # deadline is derived from are the values the client really uses.
            connect-timeout: ${inventory.connect-timeout-ms}
            read-timeout: ${inventory.reserve-timeout-ms}
            # No in-call retries: see InventoryClientConfig.
          payment-gateway:
            # From payment.* below: the same values the CREATED deadline's
            # payment budget is derived from (CreateOrderSettings).
            connect-timeout: ${payment.connect-timeout-ms}
            read-timeout: ${payment.read-timeout-ms}
            # No Feign-level retries: resilience4j does them (PaymentCalls).

# All four values below are PROVISIONAL: picked from one-laptop Inventory load
# runs that were not repeated (docs/decisions.md, "Order creation: retries,
# conflicts, deadlines and Inventory failures", point 7). Recheck on Day 9.
inventory:
  base-url: http://localhost:8082
  connect-timeout-ms: 1000
  # The per-call timeout of reserve. Also one factor of the CREATED deadline
  # and of maxLines.
  reserve-timeout-ms: 2000

# The payment gateway. Locally this is payment-stub/ on 8085, not a real gateway.
payment-gateway:
  base-url: http://localhost:8085

# Payment call (decisions.md, "Day 5: payment step, resilience and derived
# deadlines", points 3 and 4). PROVISIONAL, unmeasured, recheck Day 9. The
# timeouts, attempts and wait also feed the CREATED deadline's payment budget.
payment:
  connect-timeout-ms: 1000
  read-timeout-ms: 2000
  # Retry (outside the breaker): only timeouts, connect errors and 5xx; never a
  # 4xx, never a call the open breaker refused.
  attempts: 2
  wait-ms: 500
  breaker:
    # COUNT_BASED window. Timeouts, connect errors and 5xx count as failures;
    # a 4xx is ignored (neither failure nor success).
    window-size: 10
    minimum-calls: 5
    failure-rate-percent: 50
    open-ms: 10000
    half-open-calls: 3

order:
  # Flat fee added to every order's amount (BigDecimal; a JSON string at every
  # boundary). Not stored: fee = amount - SUM(order_items.subtotal).
  fee: 49.00
  # Payment window: how long a PENDING_PAYMENT order holds its stock. A policy,
  # not derivable (decisions.md, Day 5, point 7). PROVISIONAL.
  payment-window-ms: 360000
  create:
    # Policy: the longest a crashed order may block its buyer (one live order
    # per buyer and sale). CreateOrderSettings derives from it:
    #   perReserveCall = inventory connect + read (3 s)
    #   paymentBudget  = attempts * (connect + read) + (attempts - 1) * wait (6.5 s)
    #   maxLines       = floor((max-blocking-time - paymentBudget) / perReserveCall)
    #   expires_at     = clock_timestamp() + perReserveCall * lines + paymentBudget + margin
    max-blocking-time-ms: 60000
    deadline-margin-ms: 5000
  # Expiry sweep (decisions.md, "Day 7", point 6). The interval is a policy
  # from "Day 5" (30 s). batch-size is PROVISIONAL and unmeasured (recheck Day
  # 9): at most this many due orders per pass; leftovers wait for the next one.
  sweep:
    enabled: true
    interval-ms: 30000
    batch-size: 100
    # A tick runs another pass at once while the last one picked a full batch,
    # at most this many in a row. PROVISIONAL, unmeasured.
    max-passes-per-tick: 10

# HMAC-SHA256 secret the gateway signs webhooks with (decisions.md, "Day 6",
# point 4). From the environment only, never committed. Blank fails startup
# (WebhookSignature). The payment stub must sign with the same value.
payment-webhook:
  secret: ${PAYMENT_WEBHOOK_SECRET:}

# The buyer identity the API Gateway signs (decisions.md, "Day 8", point 5).
# GATEWAY_SIGNING_SECRET is held by the Gateway and Order only, never the JWT
# secret. Blank or shorter than 32 bytes fails startup (GatewayIdentity). A
# signed header older than max-age or more than max-future ahead of Order's
# clock is a 401. max-age is the decision's 60 s; max-future (clock skew
# allowance) was chosen when built. Both PROVISIONAL, unmeasured.
gateway-identity:
  signing-secret: ${GATEWAY_SIGNING_SECRET:}
  max-age: 60s
  max-future: 5s

# Kafka (decisions.md, "Day 6", point 6). Locally the docker-compose broker.
kafka:
  bootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
  # Create payment-confirmed and order-cancelled at startup (the compose broker
  # has auto-creation off).
  create-topics: true

# Outbox relay. All three numbers PROVISIONAL, unmeasured, recheck Day 9. The
# producer's request/delivery/max-block timeouts are derived from the ack
# timeout (OutboxKafkaConfig), not set here.
outbox:
  relay:
    enabled: true
    poll-ms: 1000
    batch-size: 50
    ack-timeout-ms: 5000

# Registration with the Eureka server (decisions.md, "Day 8", addendum
# "Gateway and discovery"). Only the API Gateway looks services up; this
# service only registers. DEFAULT timings on purpose (heartbeat 30 s, lease
# 90 s): none are set here. If Eureka is down this service still starts and
# keeps retrying registration in the background (it logs, it does not fail).
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # One entry per process, so two instances on different ports register
    # separately instead of overwriting each other.
    instance-id: ${spring.application.name}:${server.port}
    # Register 127.0.0.1, not the machine's host name. Found in the Day 8
    # smoke run: Windows registered "<host>.mshome.net" (the Hyper-V/ICS
    # adapter), which the Gateway's Netty DNS resolver cannot resolve, so every
    # lb:// call was a 500 (UnknownHostException). Everything runs on one
    # laptop; a multi-host set-up would need the real address here instead.
    prefer-ip-address: true
    ip-address: 127.0.0.1

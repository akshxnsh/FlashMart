# Test-only overrides, layered over src/main/resources/application.yml
# (classpath:/config/ wins over classpath:/). Not a real secret: tests sign
# their own webhooks with it, so the suite runs without PAYMENT_WEBHOOK_SECRET.
payment-webhook:
  secret: test-only-webhook-secret

# Not a real secret: TestGatewayHeaders signs with it (40 bytes).
gateway-identity:
  signing-secret: test-only-gateway-signing-secret-0123456

# No relay schedule and no topic creation in tests, so no test context talks
# to a broker unless it asks to (OutboxRelayTest runs the relay by hand
# against @EmbeddedKafka and turns topic creation back on).
kafka:
  create-topics: false
outbox:
  relay:
    enabled: false

# No scheduled expiry sweep in tests: it would expire other tests' rows (and
# any due row in the shared dev database) behind their backs. The sweep tests
# call ExpirySweep.runOnce() by hand.
order:
  sweep:
    enabled: false

# Test-only, NOT the production pool size (still open, from the load test).
# Spring caches one context per distinct test configuration and each keeps
# its Hikari pool open, so 10+ contexts x the default 10 exceeded local
# Postgres's max_connections (100): "sorry, too many clients already". 4 is
# enough for the 2-thread races plus the main thread polling pg_stat_activity.
spring:
  datasource:
    hikari:
      maximum-pool-size: 4
  # No config server in tests: nothing may call localhost:8888 (decisions.md, Day 9).
  cloud:
    config:
      enabled: false

# No Eureka client in tests: no suite needs a running Eureka server, and no
# test context registers anything.
eureka:
  client:
    enabled: false
